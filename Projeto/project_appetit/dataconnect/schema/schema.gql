type Usuario @table {
  id: String!
  nome: String!
  email: String! @unique
  senhaHash: String!
  tipo: String!
  criadoEm: Timestamp! @default(expr: "request.time")
}

type Paciente @table {
  id: UUID! @default(expr: "uuidV4()")
  nome: String!
  responsavelId: String!
  responsavel: Usuario!
  nascimento: Date
  peso: Float
  alergias: String
  criadoEm: Timestamp! @default(expr: "request.time")
}

type Refeicao @table {
  id: UUID! @default(expr: "uuidV4()")
  pacienteId: UUID!
  paciente: Paciente!
  dataHora: Timestamp! @default(expr: "request.time")
  status: String!
  urlFotoAntes: String!
  urlFotoDepois: String
}