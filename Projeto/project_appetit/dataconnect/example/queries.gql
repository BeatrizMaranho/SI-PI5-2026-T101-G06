query ListarRefeicoesPaciente(
  $pacienteId: UUID!
) @auth(level: USER) {
  refeicaos(
    where: { 
      pacienteId: { eq: $pacienteId }
    }
    orderBy: [{ dataHora: DESC }]
  ) {
    id
    dataHora
    status
    urlFotoAntes
    urlFotoDepois
    paciente {
      nome
    }
  }
}

query ListarTodasRefeicoesPaciente($pacienteId: UUID!) @auth(level: USER) {
  refeicaos(
