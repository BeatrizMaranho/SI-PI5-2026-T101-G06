query ObterRefeicaoComDeteccoes($refeicaoId: UUID!) @auth(level: USER) {
  refeicao(id: $refeicaoId) {
    id
    dataHora
    status
    urlFotoAntes
    urlFotoDepois
    analise
    paciente {
      nome
    }
  }
}

query ListarRefeicoesPendentes($pacienteId: UUID!) {
  refeicaos(
    where: { 
      pacienteId: { eq: $pacienteId }
      status: { eq: "pendente" }
    }
    orderBy: [{ dataHora: ASC }]
  ) {
    id
    dataHora
    urlFotoAntes
    paciente {
      nome
    }
  }
}

query ResumoRefeicoes7Dias(
  $pacienteId: UUID!
  $dataLimite: Timestamp!
) {
  refeicaos(
    where: { 
      pacienteId: { eq: $pacienteId }
      dataHora: { ge: $dataLimite }
    }
    orderBy: [{ dataHora: DESC }]
  ) {
    id
    dataHora
    status
  }
}