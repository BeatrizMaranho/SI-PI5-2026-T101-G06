query ObterUsuarioAtual($id: String!) {
  usuario(id: $id) {
    id
    nome
    email
    tipo
    criadoEm
  }
}

query BuscarUsuarioPorEmail($email: String!) @auth(level: PUBLIC) {
  usuarios(
    where: {
      email: { eq: $email }
    }
  ) {
    id
    nome
    email
    tipo
    senhaHash
    criadoEm
  }
}

query ObterUsuarioPorId($id: String!) @auth(level: USER) {
  usuario(id: $id) {
    id
    nome
    email
    tipo
    criadoEm
  }
}

query ListarMeusPacientes($responsavelId: String!) @auth(level: USER) {
  pacientes(
    where: {
      responsavelId: { eq: $responsavelId }
    }
  ) {
    id
    nome
    nascimento
    peso
    alergias
    criadoEm
    responsavel {
      nome
      email
    }
  }
}

query ObterPacienteComRefeicoes($pacienteId: UUID!) {
  paciente(id: $pacienteId) {
    id
    nome
    nascimento
    responsavel {
      nome
      email
    }
    refeicoes: refeicaos_on_paciente {
      id
      dataHora
      status
      urlFotoAntes
      urlFotoDepois
    }
  }
}

